name: CI

on:
  push:
    branches: [main, master]
    paths:
      - "core/**"
      - "evolution/**"
      - "visualization/**"
      - "analysis/**"
      - "examples/**"
      - "config/**"
      - "scripts/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "core/**"
      - "evolution/**"
      - "visualization/**"
      - "analysis/**"
      - "examples/**"
      - "config/**"
      - "scripts/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

jobs:
  lint-and-test:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MPLBACKEND: Agg
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --dev

      - name: Validate shell scripts
        run: bash -n scripts/run_container.sh scripts/run_web_app.sh scripts/teardown_container.sh

      - name: Lint with Ruff
        run: uv run ruff check .

      - name: Compile Python modules
        run: >-
          uv run python -m compileall -q
          core evolution visualization analysis examples tests

      - name: Run unit tests with pytest
        run: uv run pytest -v
